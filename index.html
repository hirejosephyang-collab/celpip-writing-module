  .nav-buttons { padding:15px 20px; background:#e8e8e8; display:flex; justify-content:space-between; gap:10px; }

  .quick-word { display:flex; gap:8px; padding:10px; background:#fff8e1; border-top:1px solid #eee; }

  .stat-bar-row { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px; }

  .card-word { font-size:32px; font-weight:bold; color:#0066cc; margin-bottom:10px; }

  .flash-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
